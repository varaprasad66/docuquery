name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-lint:
    name: Backend lint (ruff)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docuquery/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check --config pyproject.toml app migrations

  backend-tests:
    name: Backend tests (unit + integration on Postgres/pgvector)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docuquery/backend
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: docuquery
          POSTGRES_PASSWORD: docuquery
          POSTGRES_DB: docuquery
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U docuquery"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://docuquery:docuquery@localhost:5433/docuquery
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -c constraints.txt -e ".[dev]"
      - name: Unit tests
        run: python -m unittest discover -s tests -t .
      - name: Fresh migration rehearsal
        run: python ../scripts/verify_migrations.py
      - name: Integration tests
        run: python -m unittest discover -s tests_integration -t .
      - name: Security scans (bandit + pip-audit)
        run: |
          bandit -c bandit.yaml -r app -q
          pip-audit -l --progress-spinner off

  frontend:
    name: Frontend lint + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docuquery/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: docuquery/frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  eval-gate:
    name: Eval gate (hit@6 threshold)
    runs-on: ubuntu-latest
    needs: backend-tests
    defaults:
      run:
        working-directory: docuquery
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: docuquery
          POSTGRES_PASSWORD: docuquery
          POSTGRES_DB: docuquery
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U docuquery"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://docuquery:docuquery@localhost:5433/docuquery
      # No embedding provider in CI: retrieval falls back to BM25-only, which
      # this threshold is calibrated against. Raise EVAL_MIN_HIT6 as the
      # golden set and corpus mature (target: 0.95+).
      EVAL_MIN_HIT6: "0.5"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Tesseract (OCR fallback for scanned sample)
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr
      - run: pip install -e "backend[dev]"
      - name: Seed corpus into a fresh database
        run: python scripts/seed_corpus.py
      - name: Golden eval (gate on hit@6)
        run: python scripts/run_eval.py 6
